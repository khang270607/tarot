<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_47" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0D1C"/>
      <stop offset="50%" stop-color="#312E81" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#08070F"/>
    </linearGradient>
    <radialGradient id="centerGlow_47" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow_47">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="500" rx="16" fill="url(#bgGrad_47)" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="10" y="10" width="280" height="480" rx="12" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Center Glow -->
  <circle cx="150" cy="230" r="120" fill="url(#centerGlow_47)"/>

  <!-- Corner Ornaments -->
  <path d="M 18 30 L 18 18 L 30 18" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
  <path d="M 282 30 L 282 18 L 270 18" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
  <path d="M 18 470 L 18 482 L 30 482" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
  <path d="M 282 470 L 282 482 L 270 482" stroke="#06B6D4" stroke-width="1.5" fill="none"/>

  <!-- Card Number / Roman Numeral -->
  <text x="150" y="52" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#06B6D4" letter-spacing="3">Knight</text>

  <!-- Central Arc / Mandala Graphic -->
  <circle cx="150" cy="225" r="75" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="150" cy="225" r="90" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.3"/>
  <polygon points="150,145 168,210 230,225 168,240 150,305 132,240 70,225 132,210" fill="none" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Main Symbol / Icon -->
  <text x="150" y="245" text-anchor="middle" font-size="54" fill="#06B6D4" filter="url(#glow_47)">🏆</text>

  <!-- Arcana / Type Badge -->
  <rect x="75" y="340" width="150" height="24" rx="12" fill="#181528" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="150" y="356" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="1">CUPS</text>

  <!-- Card Names -->
  <text x="150" y="410" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1">Knight of Cups</text>
  <text x="150" y="438" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#06B6D4">Hiệp Sĩ Cốc</text>
</svg>